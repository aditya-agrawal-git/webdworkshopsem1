<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 3 - Block and Inline</title>
  <style>
    div  { background: lightblue; margin: 5px; padding: 2px 4px; }
    span { background: lightgreen; padding: 1px 2px; }
  </style>
</head>
<body>
  <!-- Block elements start on a new line and take the full width -->
  <div>Block 1</div>
  <div>Block 2</div>
  <!-- Inline elements stay on the same line -->
  <span>Inline 1</span>
  <span>Inline 2</span>
  <span>Inline 3</span>
</body>
</html>
