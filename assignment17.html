<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 17 - Form Validation</title>
</head>
<body>
  <form action="submit.php" method="post">
    <p><input type="text" name="fullname" placeholder="Full name" required></p>
    <p><input type="email" name="email" placeholder="you@college.edu" required></p>
    <p><input type="text" name="mobile" placeholder="10-digit mobile" required
              pattern="[0-9]{10}" title="Enter exactly 10 digits"></p>
    <p><input type="password" name="password" placeholder="Min 6 characters" required minlength="6"></p>
    <p><input type="number" name="age" placeholder="Age (17-30)" required min="17" max="30"></p>
    <p><button type="submit">Register</button></p>
  </form>
</body>
</html>
